name: NODE63 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: node63-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"

jobs:
  validation:
    name: CI-C01 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout governed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$ACTUAL"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run repository validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python scripts/ci/validate-profile.py --root .

  tests:
    name: CI-C02 Validator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout governed source
        uses: actions/checkout@v6

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$ACTUAL"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests/ci \
            -p 'test_*.py' \
            -v

  secret_scan:
    name: CI-C04 Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout governed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$ACTUAL"

      - name: Scan introduced commit range
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$BASE_SHA"
            LOG_OPTS="$BASE_SHA..$SOURCE_SHA"

          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
            LOG_OPTS="$BEFORE_SHA..$SOURCE_SHA"

          else
            LOG_OPTS="--max-count=1 $SOURCE_SHA"
          fi

          echo "GITLEAKS_LOG_OPTS=$LOG_OPTS"

          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" \
            git \
            --redact \
            --exit-code=1 \
            --log-opts="$LOG_OPTS" \
            /repo

  admission:
    name: CI-C05/C06/C07 Admission Result
    if: ${{ always() }}
    needs:
      - validation
      - tests
      - secret_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Normalize result envelope
        id: normalize
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELATED_CHANGE_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              SOURCE_KIND="PR_TEST_MERGE"
              ;;
            push)
              SOURCE_KIND="PUSH_TIP"
              ;;
            *)
              echo "UNSUPPORTED_EVENT=$GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          ADMISSION="PASS"

          for RESULT in \
            "$VALIDATION_RESULT" \
            "$TEST_RESULT" \
            "$SECRET_SCAN_RESULT"
          do
            if [ "$RESULT" != "success" ]; then
              ADMISSION="FAIL"
            fi
          done

          cat > node63-ci-result.json <<EOF
          {
            "schema": "node63-ci-result/v1",
            "repository": "$GITHUB_REPOSITORY",
            "source_sha": "$SOURCE_SHA",
            "source_kind": "$SOURCE_KIND",
            "related_change_sha": "$RELATED_CHANGE_SHA",
            "validation": "$VALIDATION_RESULT",
            "tests": "$TEST_RESULT",
            "secret_scan": "$SECRET_SCAN_RESULT",
            "admission_result": "$ADMISSION",
            "ci_c07_enforcement_mode": "NATIVE_ENFORCEMENT_CANDIDATE",
            "ci_c07_closure": "NO",
            "material_release_authority": "NO"
          }
          EOF

          cat node63-ci-result.json

          echo "admission=$ADMISSION" >> "$GITHUB_OUTPUT"

      - name: Publish normalized result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node63-ci-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: node63-ci-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce admission result
        if: ${{ always() }}
        shell: bash
        env:
          ADMISSION: ${{ steps.normalize.outputs.admission }}
        run: |
          set -euo pipefail
          test "$ADMISSION" = "PASS"
